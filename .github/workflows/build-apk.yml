name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Fixed signing details — koi secret manage nahi karna, workflow khud sambhalta hai.
      KEYSTORE_PASSWORD: "RvunlDiscom@JA2026Secure"
      KEY_ALIAS: "rvunldiscom"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure release keystore exists (auto-create once, reuse forever)
        run: |
          if [ -s keystore.b64 ] && base64 -d keystore.b64 > /tmp/check.keystore 2>/dev/null \
             && keytool -list -keystore /tmp/check.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "Mojooda keystore.b64 sahi hai (password match karta hai) — usi ko use karenge."
          else
            echo "keystore.b64 missing hai ya iska password match nahi karta — NAYA keystore bana rahe hain (sirf ek hi baar hoga)."
            keytool -genkeypair -v \
              -keystore /tmp/release.keystore \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=RVUNL DISCOM Tracker, OU=Balaji Ortho Care, O=Balaji Ortho Care, L=, S=Rajasthan, C=IN"
            base64 -w0 /tmp/release.keystore > keystore.b64
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add keystore.b64
            git commit -m "chore: auto-generate release keystore [skip ci]"
            git push
          fi
          rm -f /tmp/check.keystore /tmp/release.keystore

      - name: Install dependencies
        run: bun install

      - name: Determine next version (from latest GitHub release)
        id: version
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
            | node -p "try{JSON.parse(require('fs').readFileSync(0,'utf8')).tag_name||''}catch(e){''}")
          # tag_name jaisa "v1.0.3-45" hai to usme se sirf "1.0.3" nikalo
          BASE=$(echo "$LATEST_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$BASE" ]; then
            BASE=$(node -p "require('./package.json').version || '1.0.0'")
          fi
          IFS='.' read -r MAJ MIN PATCH <<< "$BASE"
          VERSION="${MAJ}.${MIN}.$((PATCH + 1))"
          echo "Previous release: $LATEST_TAG -> next version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          npm --no-git-tag-version version "$VERSION" --allow-same-version

      - name: Build React app
        run: bun run build

      - name: Install Capacitor CLI
        run: bun add -d @capacitor/cli @capacitor/assets

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          else
            echo "android/ already exists, skipping cap add"
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Add REQUEST_INSTALL_PACKAGES permission (needed for in-app updater)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST"; then
            sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" \/>' "$MANIFEST"
            echo "Permission add ho gayi."
          else
            echo "Permission pehle se maujood hai."
          fi
          grep "REQUEST_INSTALL_PACKAGES" "$MANIFEST"

      - name: Set native Android version (versionName + versionCode)
        run: |
          VERSION_CODE=$(date +%s)
          cd android
          sed -i "s/versionName \".*\"/versionName \"${{ steps.version.outputs.version }}\"/" app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" app/build.gradle

      - name: Generate App Icons from assets/icon.png
        run: |
          mkdir -p resources
          cp public/icon-512.png resources/icon.png
          cp public/icon-512.png resources/splash.png
          bunx capacitor-assets generate --android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode release keystore
        run: base64 -d keystore.b64 > android/app/release.keystore

      - name: Build Release APK (signed)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Remove keystore from workspace
        if: always()
        run: rm -f android/app/release.keystore

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release/RvunlDiscomTracker-v${{ steps.version.outputs.version }}.apk"

      - name: Upload APK (build artifact, optional)
        uses: actions/upload-artifact@v4
        with:
          name: RvunlDiscomTracker-apk
          path: release/*.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: RVUNL/DISCOM Tracker v${{ steps.version.outputs.version }}
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
